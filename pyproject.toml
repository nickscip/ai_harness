[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-harness"
version = "0.1.0"
description = "A small, resumable adversarial orchestration harness for Claude Code and Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.scripts]
ai-harness = "ai_harness.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_harness"]

[tool.hatch.build.targets.wheel.force-include]
"council-profiles.json" = "ai_harness/council-profiles.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
